version: "3.8"

services:
  cyber-attack-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber_attack_predictor_app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - ADMIN_PASSWORD=AdminSecure2026!
    volumes:
      # Mount persistent SQLite database and datasets
      - ./data:/app/data
      # Mount trained model artifacts
      - ./models:/app/models
      # Mount generated evaluation results and plots
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
